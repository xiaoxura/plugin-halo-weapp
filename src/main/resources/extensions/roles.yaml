# 将插件公开接口聚合到匿名角色，使小程序无需 Halo 账号即可访问。
# 机制见 https://docs.halo.run 与社区实践：role-template + aggregate-to-anonymous。
# Halo RequestInfoFactory 将版本后的首段识别为 resource、第二段识别为 resourceName；只有
# /resource/{name}/{subresource} 才形成 resource/subresource。POST /resource/{name} 会按
# nonResourceURL 授权，因此登录必须显式列出完整 URL，不能伪装成 auth/login 资源。
# 注意：这里只授权公开 auth 路由，绝不授权 weapp.halo.run/weappusers。
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-halo-weapp-anonymous
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
rules:
  - apiGroups: ["api.weapp.halo.run"]
    resources: ["config"]
    # Halo 将无名称的 GET 自定义端点按 list 授权；同时保留 get 兼容已命名读取语义。
    verbs: ["get", "list"]
  - apiGroups: ["api.weapp.halo.run"]
    resources: ["session"]
    verbs: ["create"]
  - apiGroups: ["api.weapp.halo.run"]
    resources: ["auth"]
    resourceNames: ["profile"]
    verbs: ["get", "patch"]
  - apiGroups: ["api.weapp.halo.run"]
    resources: ["auth"]
    resourceNames: ["session"]
    verbs: ["delete"]
  # Halo 2.25.4 的 resourceNames 匹配器只接受规则中的首项，保持一项一规则才能同时最小授权。
  - apiGroups: ["api.weapp.halo.run"]
    resources: ["auth"]
    resourceNames: ["account"]
    verbs: ["delete"]
  - nonResourceURLs:
      - "/apis/api.weapp.halo.run/v1alpha1/auth/login"
    verbs: ["create"]
  - apiGroups: ["api.weapp.halo.run"]
    resources: ["comments", "comments/replies"]
    verbs: ["create"]
