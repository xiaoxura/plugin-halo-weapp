metadata:
  # 与 API group / 仓库同名，冻结于 docs/development-plan-v0.3.0.md
  name: plugin-halo-weapp
spec:
  enabled: true
  requires: ">=2.23.0"
  author:
    name: xiaoxura
    website: https://github.com/xiaoxura
  logo: logo.png
  homepage: https://github.com/xiaoxura/plugin-halo-weapp#readme
  repo: https://github.com/xiaoxura/plugin-halo-weapp
