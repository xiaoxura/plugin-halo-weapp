plugins {
    id 'java'
    id "run.halo.plugin.devtools" version "0.6.2"
}

group 'run.halo.weapp'

// 最低 Halo API 编译基线可由维护 CI 覆盖，默认产物始终以 2.23.0 编译。
def haloApiVersion = providers.gradleProperty('haloApiVersion').getOrElse('2.23.0')
def haloDevVersion = providers.gradleProperty('haloDevVersion').getOrElse('2.25.4')

repositories {
    mavenCentral()
}

dependencies {
    // 只使用正式版本，禁止 SNAPSHOT（见 docs/development-plan-v0.3.0.md 决策表）
    implementation platform("run.halo.tools.platform:plugin:${haloApiVersion}")
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    // 本地 haloServer 调试版本可用 -PhaloDevVersion=... 覆盖。
    version = haloDevVersion
}
