import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Init script used by audit-halo-platform.py. Keeping this outside build.gradle avoids
// changing the plugin's published dependency graph merely to produce an audit inventory.
gradle.projectsEvaluated {
    rootProject.tasks.register('printSecurityCoordinates') {
        doLast {
            def requested = (rootProject.findProperty('securityConfigurations')
                ?: 'compileClasspath').toString()
                .split(',')
                .collect { it.trim() }
                .findAll { !it.isEmpty() }
            def rows = new TreeSet<String>()

            requested.each { configurationName ->
                def configuration = rootProject.configurations.findByName(configurationName)
                if (configuration == null) {
                    throw new GradleException("Unknown configuration: ${configurationName}")
                }
                if (!configuration.canBeResolved) {
                    throw new GradleException(
                        "Configuration is not resolvable: ${configurationName}")
                }
                configuration.incoming.resolutionResult.allComponents.each { component ->
                    def id = component.id
                    if (id instanceof ModuleComponentIdentifier) {
                        rows.add([
                            configurationName,
                            id.group,
                            id.module,
                            id.version,
                        ].join('|'))
                    }
                }
            }

            rows.each { row -> println("SECURITY_COORD|${row}") }
        }
    }
}
